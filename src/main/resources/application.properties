quarkus.application.name=Domácí odměny
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# Qute
# ---------------------------------------------------------------------------
quarkus.qute.strict-rendering=true
quarkus.qute.remove-standalone-lines=true

# ---------------------------------------------------------------------------
# HTTP security policies (enforced server-side on every request)
# ---------------------------------------------------------------------------
quarkus.http.auth.permission.public.paths=/assets/*,/favicon.svg,/favicon.ico,/manifest.webmanifest,/sw.js,/icons/*,/q/health*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ---------------------------------------------------------------------------
# CSRF (Quarkus rest-csrf): double-submit cookie + request header for HTMX
# ---------------------------------------------------------------------------
quarkus.rest-csrf.cookie-name=csrftoken
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
app.name=Domácí odměny
app.household-id=${HOUSEHOLD_ID:default}
app.household-name=${HOUSEHOLD_NAME:Naše domácnost}
app.currency=${CURRENCY:CZK}
app.timezone=${TIMEZONE:Europe/Prague}

app.dynamodb.region=${AWS_REGION:eu-central-1}
app.dynamodb.endpoint-override=
app.dynamodb.tables.members=${MEMBERS_TABLE:Members}
app.dynamodb.tables.tasks=${TASKS_TABLE:Tasks}
app.dynamodb.tables.activity=${ACTIVITY_TABLE:Activity}
app.dynamodb.tables.pending=${PENDING_TABLE:Pending}
app.dynamodb.create-tables=false

app.seed.enabled=false
app.seed.catalog=${SEED_CATALOG:false}
app.dev-auth.enabled=false

# ---------------------------------------------------------------------------
# Development profile: no Cognito, dev login, DynamoDB Local
# ---------------------------------------------------------------------------
%dev.quarkus.oidc.tenant-enabled=false
%dev.quarkus.http.auth.permission.public.paths=/assets/*,/favicon.svg,/favicon.ico,/manifest.webmanifest,/sw.js,/icons/*,/q/health*,/q/dev-ui/*,/dev-login*
%dev.app.dev-auth.enabled=true
%dev.app.dynamodb.endpoint-override=http://localhost:8000
%dev.app.dynamodb.create-tables=true
%dev.app.seed.enabled=true
%dev.app.seed.catalog=true
%dev.quarkus.log.category."cz.domaci.odmeny".level=DEBUG

# ---------------------------------------------------------------------------
# Test profile: OIDC disabled, tests use @TestSecurity
# ---------------------------------------------------------------------------
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/test
%test.quarkus.oidc.client-id=test
%test.quarkus.oidc.credentials.secret=test
%test.app.dev-auth.enabled=false
%test.app.dynamodb.endpoint-override=http://localhost:8000
%test.app.dynamodb.create-tables=false
%test.app.seed.enabled=false
%test.app.seed.catalog=false
%test.quarkus.log.category."cz.domaci.odmeny".level=INFO

# ---------------------------------------------------------------------------
# Production profile: Amazon Cognito via OIDC authorization code flow
# Values are supplied by the SAM template as environment variables.
# ---------------------------------------------------------------------------
%prod.quarkus.oidc.tenant-enabled=true
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.application-type=web-app
%prod.quarkus.oidc.authentication.scopes=openid,profile,email
%prod.quarkus.oidc.authentication.redirect-path=/q/oidc-callback
%prod.quarkus.oidc.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.roles.role-claim-path=cognito:groups
%prod.quarkus.oidc.token-state-manager.encryption-secret=${OIDC_SESSION_SECRET}
%prod.quarkus.oidc.token-state-manager.split-tokens=true
%prod.quarkus.oidc.logout.path=/logout
%prod.quarkus.oidc.logout.post-logout-path=/
%prod.quarkus.oidc.logout.post-logout-uri-param=logout_uri
%prod.quarkus.oidc.logout.extra-params.client_id=${OIDC_CLIENT_ID}
%prod.app.seed.catalog=${SEED_CATALOG:true}

# Structured logs make CloudWatch Logs Insights queries practical.
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.exception-output-type=formatted

# Lambda Function URL terminates TLS; trust the forwarded scheme/host
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true
%prod.quarkus.http.proxy.enable-forwarded-host=true

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vývojové přihlášení — Domácí odměny</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/pico.min.css">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="container">
    <hgroup>
        <h1>Vývojové přihlášení</h1>
        <p>Pouze pro lokální vývoj. V produkci přihlášení zajišťuje Amazon Cognito.</p>
    </hgroup>

    <div class="grid">
        {#for user in users}
        <a href="/dev-login/{user.key}" role="button" class="secondary">
            {user.displayName}
            <small>({user.roleLabel})</small>
        </a>
        {/for}
    </div>
</main>
</body>
</html>
